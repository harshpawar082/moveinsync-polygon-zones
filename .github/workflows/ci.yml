name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and run all tests
        run: mvn -B verify
      - name: Benchmark (5,000 polygons)
        run: |
          mvn -B -q dependency:build-classpath -Dmdep.outputFile=cp.txt
          java -Xmx2g -cp target/classes:target/test-classes:$(cat cp.txt) com.moveinsync.zones.bench.ZoneBenchmark | tee benchmark.md
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: benchmark.md
